services:
  monitor:
    build:
      context: .
      dockerfile: Dockerfile
    image: uptime-monitor:latest
    container_name: uptime-monitor
    ports:
      - "8080:8080"
    volumes:
      - ./config:/config:ro
      - ./data:/data
    environment:
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-changeme}
      - POLL_INTERVAL=${POLL_INTERVAL:-30s}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    network_mode: host
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

