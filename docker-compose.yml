services:
  monitor:
    image: uptime-monitor:local
    container_name: uptime-monitor
    ports:
      - "8080:8080"
    volumes:
      - ./config:/config:ro
      - ./data:/data
      - ./tailscale-state:/var/lib/tailscale
    environment:
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-changeme}
      - POLL_INTERVAL=${POLL_INTERVAL:-30s}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Local collector: to monitor the HOST (not the container), uncomment
      # HOST_PROC and mount /proc read-only, and add `pid: host` under this
      # service. See README "Monitoring localhost".
      - HOST_PROC=${HOST_PROC:-}
      # Tailscale configuration (optional)
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_HOSTNAME=${TS_HOSTNAME:-uptime-monitor}
      - TS_ROUTES=${TS_ROUTES:-}
      - TS_EXTRA_ARGS=${TS_EXTRA_ARGS:-}
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    # NOTE: no network_mode: host here — this Docker install sandboxes
    # host-networking listeners where operators cannot reach them, which
    # silently discarded the published port below. Outbound polling
    # (incl. MagicDNS/Tailnet targets) is unaffected by publishing instead.
    restart: unless-stopped
    healthcheck:
      # busybox wget: the runtime image ships no curl.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

