{{define "base"}}<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" id="theme-color-meta" content="#11151c">
    <title>{{block "title" .}}Uptime Monitor{{end}}</title>
    <link rel="stylesheet" href="/static/app.css">
    <script src="/static/chart.min.js" defer></script>
    <script src="/static/app.js" defer></script>
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <nav class="topnav" aria-label="Main navigation">
        <a class="brand" href="/">uptime-monitor</a>
        <div class="nav-links">
            <a href="/" data-nav="hosts">Hosts</a>
            <a href="/compare" data-nav="compare">Compare</a>
            <a href="/projects" data-nav="projects">Projects</a>
            <a href="/projects/config" data-nav="projects-config">Project Config</a>
            <a href="/alerts" data-nav="alerts">Alerts</a>
            <a href="/alerts/history" data-nav="alerts-history">Alert History</a>
            <a href="/alerts/config" data-nav="alerts-config">Alert Config</a>
            <a href="/monitor" data-nav="monitor">Monitor</a>
        </div>
        <div class="project-switcher" id="projectSwitcher">
            <select id="projectSelect" aria-label="Select project" onchange="switchProject(this.value)">
                <option value="">All Projects</option>
            </select>
        </div>
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme" aria-pressed="false">☾</button>
    </nav>
    <main id="main" class="container">
        {{template "content" .}}
    </main>
    <script>
        async function loadProjects() {
            try {
                const response = await fetch('/api/projects', {
                    headers: { 'Accept': 'application/json' }
                });
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const projects = await response.json();
                const select = document.getElementById('projectSelect');
                select.querySelectorAll('option:not([value=""])').forEach(o => o.remove());
                const currentProjectId = new URLSearchParams(window.location.search).get('project_id') || '';
                projects.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p.id;
                    opt.textContent = p.name;
                    if (String(p.id) === currentProjectId) opt.selected = true;
                    select.appendChild(opt);
                });
            } catch (err) {
                console.error('Failed to load projects:', err);
            }
        }

        function switchProject(projectId) {
            const url = new URL(window.location.href);
            if (projectId) {
                url.searchParams.set('project_id', projectId);
            } else {
                url.searchParams.delete('project_id');
            }
            window.location.href = url.toString();
        }

        loadProjects();
    </script>
</body>
</html>{{end}}
