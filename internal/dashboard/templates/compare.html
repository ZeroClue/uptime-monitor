{{define "title"}}Compare{{end}}
{{define "content"}}
<div class="header">
    <h1>Multi-Host Comparison</h1>
</div>
<div class="controls">
    <label for="metric">Metric</label>
    <select id="metric">
        <option value="cpu.user_pct">CPU User %</option>
        <option value="cpu.system_pct">CPU System %</option>
        <option value="cpu.idle_pct">CPU Idle %</option>
        <option value="cpu.load_1m">Load 1m</option>
        <option value="mem.used_pct">Memory Used %</option>
        <option value="disk.used_pct">Disk Used %</option>
    </select>
    <label for="hosts">Hosts</label>
    <select name="hosts" id="hosts" multiple size="5" style="height: 100px;">
        <option value="">Select hosts...</option>
    </select>
    <label for="timeRange">Range</label>
    <select name="timeRange" id="timeRange">
        <option value="1h">Last hour</option>
        <option value="6h" selected>Last 6 hours</option>
        <option value="24h">Last 24 hours</option>
        <option value="7d">Last 7 days</option>
    </select>
    <label for="resolution">Resolution</label>
    <select name="resolution" id="resolution">
        <option value="raw">Raw</option>
        <option value="1m" selected>1 minute</option>
        <option value="1h">1 hour</option>
    </select>
    <button class="primary" onclick="loadCompare()">Refresh</button>
</div>
<div class="panel">
    <div class="chart-container-lg">
        <canvas id="compareChart"></canvas>
    </div>
</div>
<table class="data-table" id="compareTable" hidden>
    <thead>
        <tr>
            <th>Host</th>
            <th>Last Value</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>
<script>
    let chart = null;
    let hosts = [];
    let autoLoadOnInit = false;

    function cssVar(name) {
        return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }

    function palette() {
        return [
            cssVar('--series-1'), cssVar('--series-2'), cssVar('--series-3'),
            cssVar('--series-4'), cssVar('--series-5'), cssVar('--series-6'),
            cssVar('--ok'), cssVar('--warn'), cssVar('--crit')
        ];
    }

    function chartOptions() {
        return {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
                legend: { display: true, position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } }
            },
            scales: {
                x: { ticks: { color: cssVar('--text-dim'), font: { family: cssVar('--mono') } }, grid: { color: cssVar('--border') } },
                y: { beginAtZero: false, ticks: { color: cssVar('--text-dim'), font: { family: cssVar('--mono') } }, grid: { color: cssVar('--border') } }
            }
        };
    }

    function fmtLast(v) {
        if (v === null || v === undefined) return '—';
        const metric = document.getElementById('metric').value;
        const pct = /pct$/.test(metric);
        if (pct) return v.toFixed(1) + '%';
        if (Math.abs(v) >= 1e9) return (v / 1e9).toFixed(2) + 'G';
        if (Math.abs(v) >= 1e6) return (v / 1e6).toFixed(2) + 'M';
        if (Math.abs(v) >= 1e3) return (v / 1e3).toFixed(1) + 'k';
        return v.toFixed(2);
    }

    function initHosts(selected) {
        const select = document.getElementById('hosts');
        fetch('/api/hosts')
            .then(r => r.json())
            .then(data => {
                hosts = data;
                select.innerHTML = '<option value="">Select hosts...</option>';
                data.forEach(h => {
                    const opt = document.createElement('option');
                    opt.value = h.id;
                    opt.textContent = h.name;
                    select.appendChild(opt);
                });
                if (selected && selected.length) {
                    Array.from(select.options).forEach(o => {
                        if (selected.includes(o.value)) o.selected = true;
                    });
                }
                if (autoLoadOnInit) loadCompare();
            });
    }

    function updateChart(data) {
        const container = document.querySelector('.chart-container-lg');
        if (chart) { chart.destroy(); chart = null; }
        const hasData = data && data.series && data.series.length > 0 && data.labels && data.labels.length > 0;
        if (!hasData) {
            container.innerHTML = '<div class="empty">No data in range</div>';
        } else {
            container.innerHTML = '<canvas id="compareChart"></canvas>';
            const ctx = document.getElementById('compareChart').getContext('2d');
            const colors = palette();
            const datasets = data.series.map((s, i) => ({
                label: s.host, data: s.data.map(d => d[1]), borderColor: colors[i % colors.length],
                fill: false, tension: 0.1, pointRadius: 0
            }));
            chart = new Chart(ctx, {
                type: 'line',
                data: { labels: data.labels, datasets },
                options: chartOptions()
            });
        }

        // per-host last-value table
        const table = document.getElementById('compareTable');
        const tbody = table.querySelector('tbody');
        if (data && data.series && data.series.length) {
            tbody.innerHTML = data.series.map(s => {
                const last = s.data && s.data.length ? s.data[s.data.length - 1][1] : null;
                const when = s.data && s.data.length ? new Date(s.data[s.data.length - 1][0] * 1000).toLocaleTimeString() : '—';
                return '<tr><td>' + s.host + '</td><td class="num mono">' + fmtLast(last) + '</td></tr>';
            }).join('');
            table.hidden = false;
        } else {
            table.hidden = true;
        }
    }

    function syncUrl() {
        const metric = document.getElementById('metric').value;
        const selected = Array.from(document.getElementById('hosts').selectedOptions).map(o => o.value).filter(v => v !== '');
        const timeRange = document.getElementById('timeRange').value;
        const resolution = document.getElementById('resolution').value;
        const params = new URLSearchParams();
        params.set('metric', metric);
        if (selected.length) params.set('hosts', selected.join(','));
        params.set('timeRange', timeRange);
        params.set('resolution', resolution);
        history.replaceState(null, '', '/compare?' + params.toString());
    }

    function loadCompare() {
        const metric = document.getElementById('metric').value;
        const selected = Array.from(document.getElementById('hosts').selectedOptions).map(o => o.value).filter(v => v !== '');
        if (selected.length === 0) return;
        const timeRange = document.getElementById('timeRange').value;
        const resolution = document.getElementById('resolution').value;
        const url = '/api/compare?metric=' + encodeURIComponent(metric) + '&hosts=' + selected.join(',') + '&timeRange=' + timeRange + '&resolution=' + resolution;
        syncUrl();
        fetch(url, { headers: { 'Accept': 'application/json' } })
            .then(r => r.json())
            .then(updateChart)
            .catch(err => console.error('Failed to load compare:', err));
    }

    document.addEventListener('DOMContentLoaded', function () {
        const params = new URLSearchParams(window.location.search);
        const pMetric = params.get('metric');
        const pHosts = params.get('hosts');
        const pRange = params.get('timeRange');
        const pRes = params.get('resolution');
        if (pMetric) document.getElementById('metric').value = pMetric;
        if (pRange) document.getElementById('timeRange').value = pRange;
        if (pRes) document.getElementById('resolution').value = pRes;
        if (pMetric && pHosts) autoLoadOnInit = true;
        initHosts(pHosts ? pHosts.split(',') : null);
        if (pMetric && pHosts) loadCompare();
    });
    ['metric', 'hosts', 'timeRange', 'resolution'].forEach(id => {
        document.getElementById(id).addEventListener('change', loadCompare);
    });
</script>
{{end}}
