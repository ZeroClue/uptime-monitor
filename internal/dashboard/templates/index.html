{{define "title"}}Hosts{{end}}
{{define "content"}}
<div class="header">
    <h1>Hosts</h1>
    <span class="sub">{{len .Hosts}} host(s)</span>
</div>
<div class="controls">
    <div class="segmented" role="group" aria-label="Host view">
        <button type="button" class="seg-btn active" data-view="table" onclick="setView('table')">Table</button>
        <button type="button" class="seg-btn" data-view="tiles" onclick="setView('tiles')">Tiles</button>
    </div>
    <span class="last-updated mono" id="lastUpdated">—</span>
</div>

<div class="tag-filter" id="tagFilter" hidden></div>

<table class="data-table host-table" id="hostTable">
    <thead>
        <tr>
            <th data-sort="name" tabindex="0" onclick="sortBy('name')" onkeydown="if(event.key==='Enter')sortBy('name')">Host <span class="sort-arrow"></span></th>
            {{if gt .ProjectCount 1}}<th data-sort="project" tabindex="0" onclick="sortBy('project')" onkeydown="if(event.key==='Enter')sortBy('project')">Project <span class="sort-arrow"></span></th>{{end}}
            <th data-sort="status" tabindex="0" onclick="sortBy('status')" onkeydown="if(event.key==='Enter')sortBy('status')">Status <span class="sort-arrow"></span></th>
            <th data-sort="cpu" tabindex="0" onclick="sortBy('cpu')" onkeydown="if(event.key==='Enter')sortBy('cpu')">CPU <span class="sort-arrow"></span></th>
            <th data-sort="mem" tabindex="0" onclick="sortBy('mem')" onkeydown="if(event.key==='Enter')sortBy('mem')">MEM <span class="sort-arrow"></span></th>
            <th data-sort="uptime" tabindex="0" onclick="sortBy('uptime')" onkeydown="if(event.key==='Enter')sortBy('uptime')">Uptime <span class="sort-arrow"></span></th>
        </tr>
    </thead>
    <tbody id="hostRows"></tbody>
</table>

<div class="grid host-tiles" id="hostTiles" hidden></div>

<script>
    const HOSTS = {{.HostsJSON}};
    const SHOW_PROJECT_COLUMN = {{.ProjectCount}} > 1;
    const VIEW_KEY = 'uptime-monitor-host-view';

    let view = 'table';
    let summaries = {};
    let sortKey = 'name';
    let sortDir = 1;
    let refreshTimer = null;
    let tagFilter = new Set();

    function statusInfo(id) {
        const st = summaries[id] || {};
        const s = st.status || 'unknown';
        let label = 'UNKNOWN';
        if (s === 'ok') label = 'OK';
        else if (s === 'warning') label = 'WARN';
        else if (s === 'down') label = 'DOWN';
        return { cls: s, label: label };
    }

    function fmtPct(v) {
        if (v === null || v === undefined) return '—';
        return v.toFixed(1) + '%';
    }

    function fmtUptime(secs) {
        if (secs === null || secs === undefined) return '—';
        const d = Math.floor(secs / 86400);
        const h = Math.floor((secs % 86400) / 3600);
        const m = Math.floor((secs % 3600) / 60);
        return (d > 0 ? d + 'd ' : '') + h + 'h ' + m + 'm';
    }

    function buildTooltip(s) {
        if (!s) return 'No poll data yet';
        const parts = [];
        parts.push('reachable: ' + (s.reachable ? 'yes' : 'no'));
        if (s.last_poll) parts.push('last poll: ' + new Date(s.last_poll).toLocaleString());
        if (s.collector) parts.push('collector: ' + s.collector);
        if (s.latency_ms) parts.push('latency: ' + s.latency_ms + 'ms');
        if (s.last_error) parts.push('error: ' + s.last_error);
        return parts.join('\n');
    }

    function rowFor(host) {
        const info = statusInfo(host.id);
        const sum = summaries[host.id] || {};
        const tags = (host.tags || []).map(t => '<span class="tag">' + t + '</span>').join('');
        return {
            name: host.name,
            status: info.cls,
            statusLabel: info.label,
            cpu: sum.cpu_pct,
            mem: sum.mem_pct,
            uptime: sum.uptime_seconds,
            tagsHtml: tags,
            tags: host.tags || [],
            project: host.project_name || '—',
            tooltip: buildTooltip(summaries[host.id]),
            id: host.id
        };
    }

    function hostMatchesFilter(row) {
        if (tagFilter.size === 0) return true;
        for (const tag of tagFilter) {
            if (!row.tags.includes(tag)) return false;
        }
        return true;
    }

    function renderRows() {
        const rows = HOSTS.map(rowFor).filter(hostMatchesFilter);
        const dir = sortDir;
        rows.sort((a, b) => {
            let av = a[sortKey], bv = b[sortKey];
            if (sortKey === 'name') { av = a.name; bv = b.name; }
        if (sortKey === 'project') { av = a.project; bv = b.project; }
            if (sortKey === 'status') { av = a.status; bv = b.status; }
            if (av === bv) return 0;
            if (av === null || av === undefined) return 1;
            if (bv === null || bv === undefined) return -1;
            if (typeof av === 'string') return av.localeCompare(bv) * dir;
            return (av - bv) * dir;
        });

        document.querySelectorAll('#hostTable th').forEach(th => {
            const k = th.getAttribute('data-sort');
            const arrow = th.querySelector('.sort-arrow');
            arrow.textContent = k === sortKey ? (dir === 1 ? '▲' : '▼') : '';
        });

        const tbody = document.getElementById('hostRows');
        tbody.innerHTML = rows.map(r =>
            '<tr><td><a href="/host/' + r.id + '">' + r.name + '</a><div class="tags">' + r.tagsHtml + '</div></td>' +
            (SHOW_PROJECT_COLUMN ? '<td>' + r.project + '</td>' : '') +
            '<td><span class="status ' + r.status + '" title="' + (r.tooltip || r.statusLabel) + '">' + r.statusLabel + '</span></td>' +
            '<td class="num mono">' + fmtPct(r.cpu) + '</td>' +
            '<td class="num mono">' + fmtPct(r.mem) + '</td>' +
            '<td class="num mono">' + fmtUptime(r.uptime) + '</td></tr>'
        ).join('');

        const tiles = document.getElementById('hostTiles');
        tiles.innerHTML = rows.map(r =>
            '<div class="card"><div class="card-header"><a class="card-title" href="/host/' + r.id + '">' + r.name + '</a><span class="status ' + r.status + '">' + r.statusLabel + '</span></div>' +
            '<div class="tile-grid">' +
            '<div class="metric"><span class="metric-label">CPU</span><span class="metric-value mono">' + fmtPct(r.cpu) + '</span></div>' +
            '<div class="metric"><span class="metric-label">MEM</span><span class="metric-value mono">' + fmtPct(r.mem) + '</span></div>' +
            '<div class="metric"><span class="metric-label">Uptime</span><span class="metric-value mono">' + fmtUptime(r.uptime) + '</span></div>' +
            '</div><div class="tags">' + r.tagsHtml + '</div></div>'
        ).join('');
    }

    function applyView(v) {
        view = v === 'tiles' ? 'tiles' : 'table';
        document.querySelectorAll('.seg-btn').forEach(b =>
            b.classList.toggle('active', b.getAttribute('data-view') === view)
        );
        document.getElementById('hostTable').hidden = view !== 'table';
        document.getElementById('hostTiles').hidden = view !== 'tiles';
        try { localStorage.setItem(VIEW_KEY, view); } catch (e) {}
        const params = new URLSearchParams();
        if (view === 'tiles') params.set('view', 'tiles');
        if (tagFilter.size > 0) params.set('tags', Array.from(tagFilter).join(','));
        history.replaceState(null, '', '/?' + params.toString());
    }

    function setView(v) {
        applyView(v);
    }

    function sortBy(key) {
        if (sortKey === key) { sortDir = -sortDir; }
        else { sortKey = key; sortDir = 1; }
        renderRows();
    }

    function sortBy(key) {
        if (sortKey === key) { sortDir = -sortDir; }
        else { sortKey = key; sortDir = 1; }
        renderRows();
    }

    function buildTagFilter() {
        const allTags = new Set();
        HOSTS.forEach(h => (h.tags || []).forEach(t => allTags.add(t)));
        const container = document.getElementById('tagFilter');
        if (allTags.size === 0) {
            container.hidden = true;
            return;
        }
        container.hidden = false;
        const tags = Array.from(allTags).sort();
        const params = new URLSearchParams(window.location.search);
        const urlTags = new Set((params.get('tags') || '').split(',').filter(Boolean));
        container.innerHTML = tags.map(tag => {
            const active = urlTags.has(tag) ? ' active' : '';
            return '<span class="tag-filter-chip' + active + '" data-tag="' + tag + '">' + tag + '</span>';
        }).join(' ');
        container.querySelectorAll('.tag-filter-chip').forEach(chip => {
            chip.onclick = function () {
                const t = this.getAttribute('data-tag');
                if (tagFilter.has(t)) tagFilter.delete(t);
                else tagFilter.add(t);
                applyView(view);
                renderRows();
            };
        });
    }

    function fetchSummary() {
        return fetch('/api/hosts/status', { headers: { 'Accept': 'application/json' } })
            .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
            .then(data => {
                summaries = {};
                data.forEach(s => { summaries[s.host_id] = s; });
                renderRows();
                const el = document.getElementById('lastUpdated');
                el.textContent = new Date().toLocaleTimeString();
            })
            .catch(err => {
                const el = document.getElementById('lastUpdated');
                el.textContent = 'refresh failed: ' + err.message;
            });
    }

    function startRefresh() {
        clearInterval(refreshTimer);
        refreshTimer = setInterval(() => {
            if (document.hidden) return;
            fetchSummary();
        }, 30000);
    }

    document.addEventListener('DOMContentLoaded', function () {
        const params = new URLSearchParams(window.location.search);
        const urlTags = (params.get('tags') || '').split(',').filter(Boolean);
        urlTags.forEach(t => tagFilter.add(t));
        let v = params.get('view');
        if (!v) { try { v = localStorage.getItem(VIEW_KEY); } catch (e) {} }
        applyView(v || 'table');
        buildTagFilter();
        fetchSummary();
        startRefresh();
    });
</script>
{{end}}
