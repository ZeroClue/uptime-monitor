{{define "title"}}{{.Name}}{{end}}
{{define "content"}}
<div class="header">
    <h1>{{.Name}}</h1>
    <span id="uptimeLabel" class="uptime-label">Uptime: —</span>
</div>
<div class="meta">{{.Connection}}://{{.Endpoint}}:{{.Port}} · User: {{.User}} · Tags: {{range .Tags}}<span class="tag">{{.}}</span>{{end}}</div>
<div class="controls">
    <label for="timeRange">Time range</label>
    <select id="timeRange" onchange="onControlChange()">
        <option value="1h">Last hour</option>
        <option value="6h" selected>Last 6 hours</option>
        <option value="24h">Last 24 hours</option>
        <option value="7d">Last 7 days</option>
        <option value="30d">Last 30 days</option>
    </select>
    <label for="resolution">Resolution</label>
    <select name="resolution" id="resolution" onchange="onControlChange()">
        <option value="raw">Raw (30s)</option>
        <option value="1m" selected>1 minute</option>
        <option value="1h">1 hour</option>
    </select>
</div>
<div id="charts" class="grid-panels">
    <div id="loading" class="loading">Loading…</div>
</div>
<script>
    const HOST_ID = {{.ID}};
    const charts = {};
    let allMetrics = {};
    let netInterfaces = {};

    const PHYSICAL_RE = /^(eth|enp|ens|en|wlan|wlp|tailscale)/;

    function cssVar(name) {
        return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }

    function palette() {
        return [
            cssVar('--series-1'), cssVar('--series-2'), cssVar('--series-3'),
            cssVar('--series-4'), cssVar('--series-5'), cssVar('--series-6'),
            cssVar('--accent'), cssVar('--ok'), cssVar('--warn'), cssVar('--crit')
        ];
    }

    function metricLabel(name, prefix) {
        return name.startsWith(prefix) ? name.slice(prefix.length) : name;
    }

    function groupNetByInterface(metrics) {
        const ifaces = {};
        for (const [key, data] of Object.entries(metrics)) {
            const m = key.match(/^net\.(.+?)\.(rx_bytes|tx_bytes|rx_packets|tx_packets|errors)$/);
            if (m && data && data.length) {
                if (!ifaces[m[1]]) ifaces[m[1]] = {};
                ifaces[m[1]][m[2]] = data;
            }
        }
        return ifaces;
    }

    function pickDefaultInterface(ifaces) {
        const names = Object.keys(ifaces).sort();
        const physical = names.filter(n => PHYSICAL_RE.test(n) && !n.startsWith('veth'));
        return (physical[0] || names[0] || '');
    }

    function toRate(data) {
        const out = [];
        for (let i = 1; i < data.length; i++) {
            const dt = data[i][0] - data[i - 1][0];
            if (dt <= 0) continue;
            out.push([data[i][0], Math.max(0, (data[i][1] - data[i - 1][1]) / dt)]);
        }
        return out;
    }

    function labelsFrom(data) {
        return data.map(d => new Date(d[0] * 1000).toLocaleTimeString());
    }

    function chartOptions() {
        return {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
                legend: { display: true, position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } }
            },
            scales: {
                x: { ticks: { color: cssVar('--text-dim'), font: { family: cssVar('--mono') } }, grid: { color: cssVar('--border') } },
                y: { beginAtZero: false, ticks: { maxTicksLimit: 6, color: cssVar('--text-dim'), font: { family: cssVar('--mono') } }, grid: { color: cssVar('--border') } }
            }
        };
    }

    function renderChart(canvasId, title, series) {
        const canvas = document.getElementById(canvasId);
        if (!canvas) return;
        const container = canvas.parentElement;
        let emptyMsg = container.querySelector('.empty');
        if (!series.length) {
            if (charts[canvasId]) { charts[canvasId].destroy(); delete charts[canvasId]; }
            canvas.style.display = 'none';
            if (!emptyMsg) {
                emptyMsg = document.createElement('div');
                emptyMsg.className = 'empty';
                emptyMsg.textContent = 'No data in range';
                container.appendChild(emptyMsg);
            }
            return;
        }
        canvas.style.display = '';
        if (emptyMsg) emptyMsg.remove();
        const colors = palette();
        const labels = labelsFrom(series[0].data);
        const datasets = series.map((s, i) => ({
            label: s.label,
            data: s.data.map(d => d[1]),
            borderColor: colors[i % colors.length],
            backgroundColor: colors[i % colors.length] + '22',
            fill: false,
            tension: 0.1,
            pointRadius: 0,
            borderWidth: 1.5
        }));
        if (charts[canvasId]) {
            const c = charts[canvasId];
            c.data.labels = labels;
            c.data.datasets = datasets;
            c.update();
            return;
        }
        charts[canvasId] = new Chart(canvas.getContext('2d'), {
            type: 'line',
            data: { labels, datasets },
            options: chartOptions()
        });
    }

    function buildNetPanel() {
        netInterfaces = groupNetByInterface(allMetrics);
        const names = Object.keys(netInterfaces);

        let panel = document.getElementById('netPanel');
        if (!names.length) {
            if (panel) panel.remove();
            return;
        }

        if (!panel) {
            panel = document.createElement('div');
            panel.className = 'panel';
            panel.id = 'netPanel';
            panel.innerHTML = '<div class="panel-head"><h3>Network</h3><select id="netIface"></select></div><div class="chart-container"><canvas id="netChart"></canvas></div>';
            document.getElementById('charts').appendChild(panel);
        }

        const select = document.getElementById('netIface');
        const previous = select.value;
        const isVirtual = n => /^(veth|br-|docker|virbr|lo)/.test(n);
        const sorted = names.sort((a, b) => {
            const ap = isVirtual(a) ? 1 : 0;
            const bp = isVirtual(b) ? 1 : 0;
            return ap - bp || a.localeCompare(b);
        });
        select.innerHTML = '';
        sorted.forEach(n => {
            const opt = document.createElement('option');
            opt.value = n;
            opt.textContent = n;
            select.appendChild(opt);
        });
        if (sorted.includes(previous)) select.value = previous;
        else select.value = pickDefaultInterface(netInterfaces) || sorted[0];
        select.onchange = function () { renderNetChart(this.value); };
        renderNetChart(select.value);
    }

    function renderNetChart(iface) {
        const metrics = netInterfaces[iface];
        const series = [];
        for (const key of ['rx_bytes', 'tx_bytes']) {
            if (metrics && metrics[key] && metrics[key].length) {
                series.push({ label: key, data: toRate(metrics[key]) });
            }
        }
        renderChart('netChart', 'Network: ' + iface, series);
    }

    function groupCores(metrics) {
        const cores = {};
        for (const [key, data] of Object.entries(metrics)) {
            const m = key.match(/^cpu\.core\.(\d+)\.(.+)$/);
            if (m && data && data.length) {
                if (!cores[m[1]]) cores[m[1]] = {};
                cores[m[1]][m[2]] = data;
            }
        }
        return cores;
    }

    function buildCorePanel() {
        const cores = groupCores(allMetrics);
        const names = Object.keys(cores).sort((a, b) => Number(a) - Number(b));

        let panel = document.getElementById('corePanel');
        if (!names.length) {
            if (panel) panel.remove();
            return;
        }

        if (!panel) {
            panel = document.createElement('div');
            panel.className = 'panel';
            panel.id = 'corePanel';
            panel.innerHTML = '<div class="panel-head"><h3>CPU Cores</h3><select id="coreSelect"></select></div><div class="chart-container"><canvas id="coreChart"></canvas></div>';
            document.getElementById('charts').appendChild(panel);
        }

        const select = document.getElementById('coreSelect');
        const previous = select.value;
        select.innerHTML = '';
        const optAll = document.createElement('option');
        optAll.value = 'all';
        optAll.textContent = 'All cores';
        select.appendChild(optAll);
        names.forEach(n => {
            const opt = document.createElement('option');
            opt.value = n;
            opt.textContent = 'Core ' + n;
            select.appendChild(opt);
        });
        if (names.includes(previous)) select.value = previous;
        else select.value = 'all';
        select.onchange = function () { renderCoreChart(this.value, cores); };
        renderCoreChart(select.value, cores);
    }

    function renderCoreChart(core, cores) {
        const series = [];
        if (core === 'all') {
            const sorted = Object.keys(cores).sort((a, b) => Number(a) - Number(b));
            for (const n of sorted) {
                const u = cores[n].user_pct;
                if (u && u.length) series.push({ label: 'core ' + n, data: u });
            }
        } else {
            for (const key of ['user_pct', 'system_pct', 'iowait_pct', 'idle_pct']) {
                const d = cores[core] && cores[core][key];
                if (d && d.length) series.push({ label: key.replace('_pct', ''), data: d });
            }
        }
        renderChart('coreChart', 'CPU Cores', series);
    }

    function lastValue(series) {
        return series && series.length ? series[series.length - 1][1] : null;
    }

    function fmtVal(v, isPct) {
        if (v === null || v === undefined) return '—';
        if (isPct) return v.toFixed(1) + '%';
        if (Math.abs(v) >= 1e9) return (v / 1e9).toFixed(2) + 'G';
        if (Math.abs(v) >= 1e6) return (v / 1e6).toFixed(2) + 'M';
        if (Math.abs(v) >= 1e3) return (v / 1e3).toFixed(1) + 'k';
        return v.toFixed(2);
    }

    function pickReadout(series) {
        // prefer a *_pct series for the headline value; fall back to first
        const pct = series.find(s => /_pct$/.test(s.label));
        const chosen = pct || series[0];
        return {
            value: lastValue(chosen.data),
            isPct: /_pct$/.test(chosen.label),
            label: chosen.label
        };
    }

    function panelFor(title, canvasId, series) {
        let panel = document.getElementById(canvasId + 'Panel');
        if (!series.length) {
            if (panel) panel.remove();
            return;
        }
        if (!panel) {
            panel = document.createElement('div');
            panel.className = 'panel';
            panel.id = canvasId + 'Panel';
            panel.innerHTML = '<div class="panel-head"><h3>' + title + '</h3><span class="panel-value" id="' + canvasId + 'Value"></span></div><div class="chart-container"><canvas id="' + canvasId + '"></canvas></div>';
            document.getElementById('charts').appendChild(panel);
        }
        renderChart(canvasId, title, series);
        const ro = pickReadout(series);
        const el = document.getElementById(canvasId + 'Value');
        if (el && ro.value !== null) {
            el.textContent = fmtVal(ro.value, ro.isPct);
            el.title = (ro.label || title) + ' (latest)';
        }
    }

    function renderPanels() {
        const groups = { cpu: {}, mem: {}, disk: {} };
        for (const [key, data] of Object.entries(allMetrics)) {
            if (!data || !data.length) continue;
            if (key.startsWith('cpu.')) groups.cpu[key] = data;
            else if (key.startsWith('mem.')) groups.mem[key] = data;
            else if (key.startsWith('disk.')) groups.disk[key] = data;
        }

        const cpuKeys = Object.keys(groups.cpu).filter(k => !k.startsWith('cpu.load_') && !k.startsWith('cpu.core.'));
        const loadKeys = Object.keys(groups.cpu).filter(k => k.startsWith('cpu.load_'));
        const memKeys = Object.keys(groups.mem);
        const diskKeys = Object.keys(groups.disk);

        panelFor('CPU', 'cpuChart', cpuKeys.map(k => ({ label: metricLabel(k, 'cpu.'), data: groups.cpu[k] })));
        panelFor('Load Average', 'loadChart', loadKeys.map(k => ({ label: metricLabel(k, 'cpu.'), data: groups.cpu[k] })));
        panelFor('Memory', 'memChart', memKeys.map(k => ({ label: metricLabel(k, 'mem.'), data: groups.mem[k] })));
        panelFor('Disk', 'diskChart', diskKeys.map(k => ({ label: metricLabel(k, 'disk.'), data: groups.disk[k] })));

        buildNetPanel();
        buildCorePanel();
    }

    function loadMetrics() {
        const timeRange = document.getElementById('timeRange').value;
        const resolution = document.getElementById('resolution').value;
        const url = '/api/host/' + HOST_ID + '/metrics?timeRange=' + timeRange + '&resolution=' + resolution;
        fetch(url, { headers: { 'Accept': 'application/json' } })
            .then(r => {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.json();
            })
            .then(data => {
                allMetrics = data.metrics || {};
                const loading = document.getElementById('loading');
                if (loading) loading.remove();
                renderPanels();
                updateUptimeLabel();
            })
            .catch(err => {
                const loading = document.getElementById('loading');
                if (loading) {
                    loading.textContent = 'Failed to load metrics: ' + err.message;
                    loading.className = 'error';
                }
            });
    }

    function updateUptimeLabel() {
        const series = allMetrics['uptime.seconds'];
        const label = document.getElementById('uptimeLabel');
        if (!series || !series.length) return;
        const secs = series[series.length - 1][1];
        const d = Math.floor(secs / 86400);
        const h = Math.floor((secs % 86400) / 3600);
        const m = Math.floor((secs % 3600) / 60);
        label.textContent = 'Uptime: ' + (d > 0 ? d + 'd ' : '') + h + 'h ' + m + 'm';
    }

    let refreshTimer = null;

    function syncUrl() {
        const timeRange = document.getElementById('timeRange').value;
        const resolution = document.getElementById('resolution').value;
        const params = new URLSearchParams();
        params.set('timeRange', timeRange);
        params.set('resolution', resolution);
        history.replaceState(null, '', '/host/' + HOST_ID + '?' + params.toString());
    }

    function onControlChange() {
        syncUrl();
        loadMetrics();
    }

    function startRefresh() {
        clearInterval(refreshTimer);
        refreshTimer = setInterval(() => {
            if (document.hidden) return;
            loadMetrics();
        }, 30000);
    }

    document.addEventListener('DOMContentLoaded', function () {
        const params = new URLSearchParams(window.location.search);
        const pRange = params.get('timeRange');
        const pRes = params.get('resolution');
        if (pRange) document.getElementById('timeRange').value = pRange;
        if (pRes) document.getElementById('resolution').value = pRes;
        loadMetrics();
        startRefresh();
    });
</script>
{{end}}
