# Production docker-compose - pulls from GHCR
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  monitor:
    # Pull from GHCR instead of building locally
    image: ghcr.io/zeroclue/uptime-monitor:${UPTIME_MONITOR_VERSION:-latest}
    container_name: uptime-monitor
    ports:
      - "8080:8080"
    volumes:
      - ./config:/config:ro
      - ./data:/data
    environment:
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD}
      - POLL_INTERVAL=${POLL_INTERVAL:-30s}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Tailscale configuration (optional)
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_HOSTNAME=${TS_HOSTNAME:-uptime-monitor}
      - TS_ROUTES=${TS_ROUTES:-}
      - TS_EXTRA_ARGS=${TS_EXTRA_ARGS:-}
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    network_mode: host
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

